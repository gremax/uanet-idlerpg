# TLS for bot.pl: it connects in plain text to 127.0.0.1:6667, stunnel
# forwards to irc.uanet.net:6697 and checks the server's certificate.
foreground = yes
pid =

[irc]
client = yes
accept = 127.0.0.1:6667
connect = irc.uanet.net:6697
verifyChain = yes
CAfile = /etc/ssl/certs/ca-certificates.crt
checkHost = irc.uanet.net
# The bot never notices a dead link on its own: it only sees 127.0.0.1. Probe
# the server after a minute of silence so a connection the server has dropped
# closes within about two minutes instead of at the bot's next message.
socket = r:SO_KEEPALIVE=1
socket = r:TCP_KEEPIDLE=60
socket = r:TCP_KEEPINTVL=10
socket = r:TCP_KEEPCNT=6
