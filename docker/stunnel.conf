# TLS for bot.pl: it connects in plain text to 127.0.0.1:6667, stunnel
# forwards to irc.uanet.net:6697 and checks the server's certificate.
foreground = yes
pid =

[irc]
client = yes
accept = 127.0.0.1:6667
connect = irc.uanet.net:6697
verifyChain = yes
CAfile = /etc/ssl/certs/ca-certificates.crt
checkHost = irc.uanet.net
