name: image
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # to build master by hand when GitHub drops a push event
  workflow_dispatch:
# Pull requests build without pushing, so a broken Dockerfile fails before master. Pushes to
# master are never cancelled: each publishes its own sha-<commit> tag, and a cancelled run would
# leave a commit with no image for the cluster to deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Install the bot's Perl dependencies and Perl::Critic
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libio-socket-inet6-perl libcrypt-argon2-perl libperl-critic-perl
      - name: Check bot.pl compiles
        run: perl -c bot.pl
      # only the fork's own code, as set in .perlcriticrc
      - name: Lint
        run: perlcritic lib t
      - name: Run the tests
        run: prove t/
  image:
    name: Build the image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Compute the short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A fixed image name rather than one derived from github.repository, so renaming the
      # repository cannot move where the cluster pulls from. No `latest`: deploying is a tag
      # change in the cluster repository.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/gremax/uanet-idlerpg:sha-${{ steps.sha.outputs.short }}
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
